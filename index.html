<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Five Nights at Freddy's: 3D Browser Edition</title>
    <style>
        :root {
            --crt-glow: #33ff33;
            --alert-red: #ff3333;
            --interface-bg: #121214;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
            touch-action: none; /* Prevents double-tap zooming on mobile */
        }

        /* Scanline Overlay for retro surveillance look */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.3) 50%
            );
            background-size: 100% 4px;
            z-index: 99;
            pointer-events: none;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: #050508;
            box-sizing: border-box;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* Screen Elements */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: none;
            box-sizing: border-box;
        }

        .active {
            display: flex;
            flex-direction: column;
        }

        /* Main Menu */
        #main-menu {
            background: #000;
            text-align: center;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: #ccc;
            margin-bottom: 40px;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
            letter-spacing: 2px;
            line-height: 1.4;
        }

        .btn {
            background: transparent;
            border: 2px solid #555;
            color: #aaa;
            padding: 15px 40px;
            font-size: 1.1rem;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
            border-radius: 4px;
        }

        .btn:hover, .btn:active {
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
        }

        /* Gameplay Elements & Viewport */
        #viewport-container {
            position: relative;
            width: 100%;
            flex-grow: 1;
            background: #000;
            overflow: hidden;
        }

        /* Canvas rendering element */
        #game-canvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }

        #game-canvas:active {
            cursor: grabbing;
        }

        /* HUD Overlay styling */
        #hud {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 5px;
            text-shadow: 2px 2px 2px #000;
        }

        #usage-display {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .usage-block {
            width: 10px;
            height: 15px;
            background-color: #33ff33;
        }

        #time-display {
            position: absolute;
            top: 15px;
            right: 15px;
            font-size: 1.5rem;
            font-weight: bold;
            z-index: 10;
            text-shadow: 2px 2px 2px #000;
        }

        /* Mobile Action Panels (Overlay on Left & Right) */
        .mobile-control-panel {
            position: absolute;
            bottom: 80px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 15;
            pointer-events: auto;
        }

        #left-controls { left: 15px; }
        #right-controls { right: 15px; }

        .m-btn {
            width: 65px;
            height: 55px;
            border-radius: 8px;
            border: 2px solid #555;
            background: rgba(18, 18, 20, 0.85);
            color: #ccc;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .m-btn.door-active {
            border-color: var(--alert-red);
            background: rgba(150, 20, 20, 0.9);
            color: #fff;
            box-shadow: 0 0 10px rgba(255, 0, 0, 0.4);
        }

        .m-btn.light-active {
            border-color: #ffcc00;
            background: rgba(200, 160, 20, 0.9);
            color: #000;
            box-shadow: 0 0 10px rgba(255, 200, 0, 0.4);
        }

        /* Mobile Monitor Navigation Panel */
        #mobile-monitor-panel {
            position: absolute;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            background: rgba(5, 5, 8, 0.95);
            z-index: 30;
            display: none;
            grid-template-rows: 1fr auto;
        }

        #cam-grid-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 15px;
            box-sizing: border-box;
            background: #111;
        }

        .cam-grid-btn {
            background: #222;
            border: 2px solid #444;
            color: #aaa;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .cam-grid-btn.active-cam {
            background: var(--crt-glow);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 10px var(--crt-glow);
        }

        /* Global Lower Control Bar */
        #lower-control-bar {
            width: 100%;
            height: 65px;
            background: var(--interface-bg);
            border-top: 2px solid #333;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 25;
            box-sizing: border-box;
        }

        #monitor-toggle-btn {
            width: 90%;
            max-width: 400px;
            height: 45px;
            background: #1a1a20;
            border: 2px solid #555;
            border-radius: 6px;
            color: #fff;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 8px rgba(255,255,255,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        #monitor-toggle-btn.active-monitor {
            background: var(--crt-glow);
            color: #000;
            border-color: #fff;
            box-shadow: 0 0 12px var(--crt-glow);
        }

        /* End Screens */
        .end-screen {
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .blood-text {
            color: var(--alert-red);
            font-size: 2.2rem;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }

        .win-text {
            color: var(--crt-glow);
            font-size: 2.2rem;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 20px;
            letter-spacing: 3px;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div id="game-container">
        
        <!-- Main Menu -->
        <div id="main-menu" class="screen active">
            <h1>FIVE NIGHTS<br>AT FREDDY'S<br><span style="font-size: 0.9rem; color: #777;">PSEUDO-3D MOBILE PORT</span></h1>
            <button class="btn" id="start-btn">TAP TO SURVIVE</button>
        </div>

        <!-- Office View (Gameplay Loop) -->
        <div id="office" class="screen">
            <div id="viewport-container">
                <div id="hud">
                    <div class="hud-item" id="power-display">Power: 100%</div>
                    <div class="hud-item" id="usage-display">
                        Usage: 
                        <div class="usage-block" id="usage-1"></div>
                        <div class="usage-block" id="usage-2" style="visibility: hidden;"></div>
                        <div class="usage-block" id="usage-3" style="visibility: hidden;"></div>
                    </div>
                </div>

                <div id="time-display">12 AM</div>

                <!-- 3D Drawing Canvas -->
                <canvas id="game-canvas"></canvas>

                <!-- Left Mobile Side Panel -->
                <div class="mobile-control-panel" id="left-controls">
                    <button class="m-btn" id="m-left-door">DOOR</button>
                    <button class="m-btn" id="m-left-light">LIGHT</button>
                </div>

                <!-- Right Mobile Side Panel -->
                <div class="mobile-control-panel" id="right-controls">
                    <button class="m-btn" id="m-right-door">DOOR</button>
                    <button class="m-btn" id="m-right-light">LIGHT</button>
                </div>

                <!-- Surveillance Layout Overlay -->
                <div id="mobile-monitor-panel">
                    <div id="cam-grid-container">
                        <button class="cam-grid-btn active-cam" id="grid-cam-1a">
                            <span>CAM 1A</span>
                            <span style="font-size:0.6rem; color:#888; font-weight:normal;">SHOW STAGE</span>
                        </button>
                        <button class="cam-grid-btn" id="grid-cam-1b">
                            <span>CAM 1B</span>
                            <span style="font-size:0.6rem; color:#888; font-weight:normal;">DINING AREA</span>
                        </button>
                        <button class="cam-grid-btn" id="grid-cam-2a">
                            <span>CAM 2A</span>
                            <span style="font-size:0.6rem; color:#888; font-weight:normal;">EAST HALLWAY</span>
                        </button>
                        <button class="cam-grid-btn" id="grid-cam-2b">
                            <span>CAM 2B</span>
                            <span style="font-size:0.6rem; color:#888; font-weight:normal;">EAST CORNER</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Persistent Lower Control Bar -->
            <div id="lower-control-bar">
                <button id="monitor-toggle-btn">
                    <span id="toggle-icon">▲</span> OPEN CAMERA SYSTEM
                </button>
            </div>
        </div>

        <!-- End Screens -->
        <div id="game-over" class="screen end-screen">
            <div class="blood-text">GAME OVER</div>
            <button class="btn restart-btn">TRY AGAIN</button>
        </div>

        <div id="win-screen" class="screen end-screen">
            <div class="win-text">5:59 AM...</div>
            <div class="win-text" style="font-size: 3.5rem;" id="six-am-text">6:00 AM</div>
            <p style="color: #666; margin-bottom: 30px;">Night Shift Completed.</p>
            <button class="btn restart-btn">PLAY AGAIN</button>
        </div>

    </div>

    <script>
        // --- Web Audio Synthesizer Engine ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let backgroundHum = null;

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'door') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(90, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.35);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.35);
            } else if (type === 'light') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(180, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'camera-switch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(500, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.08);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } else if (type === 'jumpscare') {
                // Generates high pitch distorted horror screen screech
                const bufferSize = audioCtx.sampleRate * 1.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1200, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 1.5);

                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.gain.setValueAtTime(0.85, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

                noise.start();
                noise.stop(audioCtx.currentTime + 1.5);
            }
        }

        function startAmbience() {
            if (backgroundHum) return;
            backgroundHum = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            backgroundHum.type = 'sawtooth';
            backgroundHum.frequency.setValueAtTime(45, audioCtx.currentTime); // Industrial room rumble
            gainNode.gain.setValueAtTime(0.08, audioCtx.currentTime);
            backgroundHum.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            backgroundHum.start();
        }

        function stopAmbience() {
            if (backgroundHum) {
                backgroundHum.stop();
                backgroundHum = null;
            }
        }

        // --- Core Game variables ---
        let gameActive = false;
        let power = 100;
        let usage = 1;
        let gameHour = 0; // 0 = 12 AM
        let timeInHourTicks = 0;

        // Freddy Location Path logic
        // Path: 1a (Stage) -> 1b (Dining) -> 2a (Hallway) -> 2b (Corner) -> door (Ready to attack)
        let freddyLocation = '1a';
        let currentCamera = '1a';
        let monitorOpen = false;

        let leftDoorOpen = true;
        let rightDoorOpen = true;
        let leftLightOn = false;
        let rightLightOn = false;

        // Camera Pan & Angle Setup
        let panX = 0; // Angle offset for dragging
        let targetPanX = 0;
        let isDragging = false;
        let dragStartX = 0;

        // Render Canvas Initializer
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        // --- Game Engine Loops ---
        let gameTimer = null;
        let behaviorTimer = null;
        let renderLoop = null;

        function startGame() {
            gameActive = true;
            power = 100;
            usage = 1;
            gameHour = 0;
            timeInHourTicks = 0;
            freddyLocation = '1a';
            currentCamera = '1a';
            monitorOpen = false;
            leftDoorOpen = true;
            rightDoorOpen = true;
            leftLightOn = false;
            rightLightOn = false;
            panX = 0;
            targetPanX = 0;

            resizeCanvas();
            updateControlsUI();
            startAmbience();

            // Toggle active screens
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('office').classList.add('active');

            if (gameTimer) clearInterval(gameTimer);
            if (behaviorTimer) clearInterval(behaviorTimer);
            
            gameTimer = setInterval(tickGameEngine, 1000);
            behaviorTimer = setInterval(tickFreddyAI, 7000); // Ticks movement state checks every 7s
            
            startRenderLoops();
        }

        function tickGameEngine() {
            if (!gameActive) return;

            calculateUsage();
            power -= (usage * 0.08);
            if (power <= 0) {
                power = 0;
                blackout();
                return;
            }
            document.getElementById('power-display').innerText = `Power: ${Math.floor(power)}%`;

            // Progress Hour Timeline
            timeInHourTicks++;
            if (timeInHourTicks >= 40) { // 40 seconds per Hour shift
                timeInHourTicks = 0;
                gameHour++;
                if (gameHour > 6) gameHour = 6;
                
                let displayHour = gameHour === 0 ? 12 : gameHour;
                document.getElementById('time-display').innerText = `${displayHour} AM`;

                if (gameHour === 6) {
                    triggerWin();
                }
            }
        }

        function calculateUsage() {
            let activePowerUses = 1;
            if (!leftDoorOpen) activePowerUses++;
            if (!rightDoorOpen) activePowerUses++;
            if (leftLightOn) activePowerUses++;
            if (rightLightOn) activePowerUses++;
            if (monitorOpen) activePowerUses++;

            usage = activePowerUses;

            for (let i = 1; i <= 3; i++) {
                const block = document.getElementById(`usage-${i}`);
                if (usage >= i + 1) {
                    block.style.visibility = 'visible';
                    if (usage === 2) block.style.backgroundColor = '#33ff33';
                    if (usage === 3) block.style.backgroundColor = '#ffcc00';
                    if (usage >= 4) block.style.backgroundColor = '#ff3333';
                } else {
                    block.style.visibility = 'hidden';
                }
            }
        }

        function tickFreddyAI() {
            if (!gameActive) return;

            const moveChance = 0.55; // 55% chance to migrate rooms
            if (Math.random() > moveChance) return;

            if (freddyLocation === '1a') {
                freddyLocation = '1b';
            } else if (freddyLocation === '1b') {
                freddyLocation = Math.random() > 0.5 ? '2a' : '2b';
            } else if (freddyLocation === '2a') {
                freddyLocation = '2b';
            } else if (freddyLocation === '2b') {
                freddyLocation = 'door';
            } else if (freddyLocation === 'door') {
                if (!rightDoorOpen) {
                    freddyLocation = '1a'; // Blocked, forced to retreat
                    playSound('door');
                } else {
                    freddyLocation = 'office_interior';
                }
            } else if (freddyLocation === 'office_interior') {
                if (!monitorOpen) {
                    triggerJumpscare();
                }
            }
        }

        // --- Drag/Mouse Panning Logic ---
        function handleDragStart(x) {
            isDragging = true;
            dragStartX = x - targetPanX;
        }

        function handleDragMove(x) {
            if (!isDragging) return;
            // Bound movement between -200px and +200px wide
            targetPanX = Math.max(-200, Math.min(200, x - dragStartX));
        }

        function handleDragEnd() {
            isDragging = false;
        }

        // Mouse Events
        canvas.addEventListener('mousedown', (e) => handleDragStart(e.clientX));
        window.addEventListener('mousemove', (e) => handleDragMove(e.clientX));
        window.addEventListener('mouseup', handleDragEnd);

        // Touch Events (Mobile Support)
        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            handleDragStart(touch.clientX);
        });
        window.addEventListener('touchmove', (e) => {
            const touch = e.touches[0];
            handleDragMove(touch.clientX);
        });
        window.addEventListener('touchend', handleDragEnd);

        // --- Vector asset graphic drawing routines ---
        function drawFreddyVector(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Shadow head
            ctx.fillStyle = '#1c0f0a';
            ctx.beginPath();
            ctx.arc(0, 0, 80, 0, Math.PI * 2);
            ctx.fill();

            // Ears
            ctx.beginPath();
            ctx.arc(-70, -70, 25, 0, Math.PI * 2);
            ctx.arc(70, -70, 25, 0, Math.PI * 2);
            ctx.fill();

            // Muzzle area
            ctx.fillStyle = '#3a2312';
            ctx.beginPath();
            ctx.ellipse(0, 20, 50, 35, 0, 0, Math.PI * 2);
            ctx.fill();

            // Nose
            ctx.fillStyle = '#050505';
            ctx.beginPath();
            ctx.ellipse(0, 5, 20, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Jaw
            ctx.fillStyle = '#150a06';
            ctx.beginPath();
            ctx.ellipse(0, 48, 45, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            // Top Hat
            ctx.fillStyle = '#0a0a0d';
            ctx.fillRect(-45, -125, 90, 50);
            ctx.fillRect(-65, -80, 130, 10);

            // Glowing Eyes (Signature red dot)
            ctx.fillStyle = '#ff3333';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(-25, -15, 8, 0, Math.PI * 2);
            ctx.arc(25, -15, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // --- Render Loop (True 3D perspective Canvas representation) ---
        function startRenderLoops() {
            function drawLoop() {
                if (!gameActive) return;

                // Smooth Panning Transition interpolation
                panX += (targetPanX - panX) * 0.12;

                if (!monitorOpen) {
                    render3DOffice();
                } else {
                    render3DCameraFeed();
                }

                // If Freddy inside office and monitor is closed -> immediate attack
                if (!monitorOpen && freddyLocation === 'office_interior') {
                    triggerJumpscare();
                    return;
                }

                renderLoop = requestAnimationFrame(drawLoop);
            }
            renderLoop = requestAnimationFrame(drawLoop);
        }

        // 3D Perspective Office Drawing routine
        function render3DOffice() {
            const w = canvas.width;
            const h = canvas.height;
            const centerX = w / 2 + panX;
            const centerY = h / 2;

            // Background wall fill
            ctx.fillStyle = '#08080a';
            if (leftLightOn || rightLightOn) {
                ctx.fillStyle = '#0f0f12';
            }
            ctx.fillRect(0, 0, w, h);

            // Ceiling and Floor grid lines to create real depth perception
            ctx.strokeStyle = '#222';
            ctx.lineWidth = 3;
            ctx.beginPath();
            // Ceiling edges
            ctx.moveTo(centerX - w * 0.8, 0);
            ctx.lineTo(centerX - w * 0.3, centerY - h * 0.25);
            ctx.lineTo(centerX + w * 0.3, centerY - h * 0.25);
            ctx.lineTo(centerX + w * 0.8, 0);
            // Floor edges
            ctx.moveTo(centerX - w * 0.8, h);
            ctx.lineTo(centerX - w * 0.3, centerY + h * 0.3);
            ctx.lineTo(centerX + w * 0.3, centerY + h * 0.3);
            ctx.lineTo(centerX + w * 0.8, h);
            ctx.stroke();

            // Draw Doors
            draw3DDoor(ctx, centerX - w * 0.6, centerY - h * 0.2, w * 0.18, h * 0.6, leftDoorOpen, leftLightOn);
            draw3DDoor(ctx, centerX + w * 0.42, centerY - h * 0.2, w * 0.18, h * 0.6, rightDoorOpen, rightLightOn);

            // Render Right Hall Corner peeking eyes when lights on
            if (rightLightOn && freddyLocation === 'door') {
                ctx.fillStyle = '#ff3333';
                ctx.shadowColor = '#ff0000';
                ctx.shadowBlur = 10;
                ctx.beginPath();
                ctx.arc(centerX + w * 0.48, centerY, 5, 0, Math.PI*2);
                ctx.arc(centerX + w * 0.52, centerY, 5, 0, Math.PI*2);
                ctx.fill();
                ctx.shadowBlur = 0; // reset
            }

            // Simple Desk geometry
            ctx.fillStyle = '#15151a';
            ctx.fillRect(centerX - w * 0.2, centerY + h * 0.2, w * 0.4, h * 0.25);
            ctx.strokeStyle = '#333';
            ctx.strokeRect(centerX - w * 0.2, centerY + h * 0.2, w * 0.4, h * 0.25);
        }

        function draw3DDoor(ctx, x, y, width, height, isOpen, isLightOn) {
            // Light splash illumination background
            if (isLightOn) {
                ctx.fillStyle = 'rgba(255, 255, 220, 0.18)';
                ctx.fillRect(x, y, width, height);
            } else {
                ctx.fillStyle = '#000';
                ctx.fillRect(x, y, width, height);
            }

            // Door Frame styling
            ctx.strokeStyle = '#3c3c45';
            ctx.lineWidth = 4;
            ctx.strokeRect(x, y, width, height);

            // Door sliding pane representation
            if (!isOpen) {
                ctx.fillStyle = '#1e1e24';
                ctx.fillRect(x + 2, y + 2, width - 4, height - 4);
                
                // Metal structural ribs on door
                ctx.fillStyle = '#0e0e12';
                ctx.fillRect(x + 4, y + 20, width - 8, 15);
                ctx.fillRect(x + 4, y + height / 2, width - 8, 15);
                ctx.fillRect(x + 4, y + height - 35, width - 8, 15);
            }
        }

        // Surveillance feeds with realistic perspective
        function render3DCameraFeed() {
            const w = canvas.width;
            const h = canvas.height;
            const vpX = w / 2;
            const vpY = h * 0.45;

            ctx.fillStyle = '#040406';
            ctx.fillRect(0, 0, w, h);

            // Render camera static background
            for (let i = 0; i < 8; i++) {
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.random() * 0.05})`;
                ctx.fillRect(0, Math.random() * h, w, Math.random() * 20);
            }

            if (currentCamera === '1a') {
                // CAM 1A: Show Stage
                ctx.fillStyle = '#0c0c12';
                ctx.fillRect(w * 0.2, h * 0.2, w * 0.6, h * 0.55); // Stage background
                ctx.fillStyle = '#1c1c24';
                ctx.fillRect(w * 0.15, h * 0.7, w * 0.7, h * 0.15); // Wooden platform

                if (freddyLocation === '1a') {
                    drawFreddyVector(ctx, w * 0.5, h * 0.5, 1.4);
                } else {
                    ctx.fillStyle = '#444';
                    ctx.font = '12px monospace';
                    ctx.fillText("[ STAGE EMPTY ]", w * 0.42, h * 0.5);
                }
            } 
            else if (currentCamera === '1b') {
                // CAM 1B: Dining Area (Perspective table lines)
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(w * 0.1, h); ctx.lineTo(vpX - 80, vpY + 50);
                ctx.moveTo(w * 0.9, h); ctx.lineTo(vpX + 80, vpY + 50);
                ctx.stroke();

                // Party Tables
                ctx.fillStyle = '#111118';
                ctx.fillRect(w * 0.15, h * 0.7, w * 0.2, h * 0.18);
                ctx.fillRect(w * 0.65, h * 0.7, w * 0.2, h * 0.18);

                if (freddyLocation === '1b') {
                    drawFreddyVector(ctx, w * 0.5, h * 0.55, 0.9);
                }
            } 
            else if (currentCamera === '2a') {
                // CAM 2A: 3D perspective hallways extending out to a vanishing point
                ctx.strokeStyle = '#2c2c36';
                ctx.lineWidth = 3;
                ctx.beginPath();
                // Ceiling & Floor guidelines
                ctx.moveTo(0, 0); ctx.lineTo(vpX - 60, vpY - 40);
                ctx.moveTo(w, 0); ctx.lineTo(vpX + 60, vpY - 40);
                ctx.moveTo(0, h); ctx.lineTo(vpX - 60, vpY + 60);
                ctx.moveTo(w, h); ctx.lineTo(vpX + 60, vpY + 60);
                ctx.stroke();

                // Far end wall
                ctx.fillStyle = '#060608';
                ctx.fillRect(vpX - 60, vpY - 40, 120, 100);

                if (freddyLocation === '2a') {
                    drawFreddyVector(ctx, vpX, vpY + 15, 0.6);
                }
            } 
            else if (currentCamera === '2b') {
                // CAM 2B: East Corner (Close up peek frame)
                ctx.fillStyle = '#0a0a0d';
                ctx.fillRect(0, 0, w, h);
                ctx.strokeStyle = '#222';
                ctx.strokeRect(w * 0.1, w * 0.1, w * 0.8, h * 0.8);

                if (freddyLocation === '2b') {
                    drawFreddyVector(ctx, w * 0.55, h * 0.5, 2.1); // Extremely large / close
                } else {
                    ctx.fillStyle = '#333';
                    ctx.font = '12px monospace';
                    ctx.fillText("[ CORNER CLEAR ]", w * 0.42, h * 0.5);
                }
            }

            // Draw overlay static line effect
            ctx.fillStyle = 'rgba(255,255,255,0.03)';
            ctx.fillRect(0, Math.random() * h, w, 2);
        }

        // --- Camera System Toggles ---
        const monitorToggleBtn = document.getElementById('monitor-toggle-btn');
        const mMonitorPanel = document.getElementById('mobile-monitor-panel');

        function toggleMonitor() {
            monitorOpen = !monitorOpen;
            playSound('camera-switch');

            if (monitorOpen) {
                mMonitorPanel.style.display = 'grid';
                monitorToggleBtn.classList.add('active-monitor');
                monitorToggleBtn.innerHTML = '<span id="toggle-icon">▼</span> CLOSE CAMERA SYSTEM';
            } else {
                mMonitorPanel.style.display = 'none';
                monitorToggleBtn.classList.remove('active-monitor');
                monitorToggleBtn.innerHTML = '<span id="toggle-icon">▲</span> OPEN CAMERA SYSTEM';
            }
            calculateUsage();
        }

        monitorToggleBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            toggleMonitor();
        });
        monitorToggleBtn.addEventListener('click', (e) => {
            // Backup selector for desktop mice inputs
            if (e.pointerType !== 'touch') toggleMonitor();
        });

        // Set camera switch logic
        function setupCamBtn(btnId, camId) {
            const btn = document.getElementById(btnId);
            
            function handleCamSelect() {
                currentCamera = camId;
                playSound('camera-switch');
                
                document.querySelectorAll('.cam-grid-btn').forEach(b => b.classList.remove('active-cam'));
                btn.classList.add('active-cam');
            }

            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                handleCamSelect();
            });
            btn.addEventListener('click', handleCamSelect);
        }

        setupCamBtn('grid-cam-1a', '1a');
        setupCamBtn('grid-cam-1b', '1b');
        setupCamBtn('grid-cam-2a', '2a');
        setupCamBtn('grid-cam-2b', '2b');

        // --- Mobile control actions mapping (Optimized for instant feedback) ---
        function registerAction(btnId, type, callback) {
            const el = document.getElementById(btnId);
            
            el.addEventListener('touchstart', (e) => {
                e.preventDefault();
                callback(el);
            });
            el.addEventListener('click', (e) => {
                if (e.pointerType !== 'touch') callback(el);
            });
        }

        registerAction('m-left-door', 'door', (el) => {
            leftDoorOpen = !leftDoorOpen;
            playSound('door');
            el.classList.toggle('door-active', !leftDoorOpen);
            calculateUsage();
        });

        registerAction('m-right-door', 'door', (el) => {
            rightDoorOpen = !rightDoorOpen;
            playSound('door');
            el.classList.toggle('door-active', !rightDoorOpen);
            calculateUsage();
        });

        registerAction('m-left-light', 'light', (el) => {
            leftLightOn = !leftLightOn;
            playSound('light');
            if (leftLightOn && rightLightOn) {
                rightLightOn = false;
                document.getElementById('m-right-light').classList.remove('light-active');
            }
            el.classList.toggle('light-active', leftLightOn);
            calculateUsage();
        });

        registerAction('m-right-light', 'light', (el) => {
            rightLightOn = !rightLightOn;
            playSound('light');
            if (rightLightOn && leftLightOn) {
                leftLightOn = false;
                document.getElementById('m-left-light').classList.remove('light-active');
            }
            el.classList.toggle('light-active', rightLightOn);
            calculateUsage();
        });

        function updateControlsUI() {
            document.getElementById('m-left-door').classList.toggle('door-active', !leftDoorOpen);
            document.getElementById('m-right-door').classList.toggle('door-active', !rightDoorOpen);
            document.getElementById('m-left-light').classList.toggle('light-active', leftLightOn);
            document.getElementById('m-right-light').classList.toggle('light-active', rightLightOn);
        }

        // --- Core Game states (Blackout, Jumpscare, Win) ---
        function blackout() {
            gameActive = false;
            stopAmbience();
            clearInterval(gameTimer);
            clearInterval(behaviorTimer);
            cancelAnimationFrame(renderLoop);

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('office').classList.add('active');
            
            leftDoorOpen = true;
            rightDoorOpen = true;
            leftLightOn = false;
            rightLightOn = false;
            monitorOpen = false;
            mMonitorPanel.style.display = 'none';
            updateControlsUI();

            // Set background style color to pitch black
            ctx.fillStyle = '#000000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('power-display').innerText = `Power: 0%`;

            setTimeout(() => {
                if (!gameActive) {
                    triggerJumpscare();
                }
            }, Math.random() * 3000 + 4000);
        }

        function triggerJumpscare() {
            gameActive = false;
            stopAmbience();
            clearInterval(gameTimer);
            clearInterval(behaviorTimer);
            cancelAnimationFrame(renderLoop);

            playSound('jumpscare');

            // Apply camera container shake style
            const container = document.getElementById('viewport-container');
            container.classList.add('shake');

            // Canvas drawing animation loops for the jumpscare frame shifts
            let jumpFrame = 0;
            function animateJumpscare() {
                ctx.fillStyle = '#000000';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Make the size of Freddy oscillate violently for an animation effect
                const shakeScale = Math.sin(jumpFrame) * 0.2 + 1.8;
                drawFreddyVector(ctx, canvas.width / 2, canvas.height / 2, shakeScale);

                jumpFrame++;
                if (jumpFrame < 45) {
                    requestAnimationFrame(animateJumpscare);
                } else {
                    container.classList.remove('shake');
                    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                    document.getElementById('game-over').classList.add('active');
                }
            }
            animateJumpscare();
        }

        function triggerWin() {
            gameActive = false;
            stopAmbience();
            clearInterval(gameTimer);
            clearInterval(behaviorTimer);
            cancelAnimationFrame(renderLoop);

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('win-screen').classList.add('active');
        }

        // Hook up menu interactions
        document.getElementById('start-btn').addEventListener('click', startGame);
        document.querySelectorAll('.restart-btn').forEach(btn => {
            btn.addEventListener('click', startGame);
        });

    </script>
</body>
</html>
