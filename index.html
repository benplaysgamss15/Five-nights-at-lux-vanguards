<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- THIS TAG IS CRITICAL FOR MOBILE SUPPORT -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Custom FNaF Fan Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-container">
        
        <!-- THE OFFICE VISUALS -->
        <div id="office-view">
            <!-- These divs will hold the door images/colors -->
            <div id="left-door" class="door"></div>
            <div id="right-door" class="door"></div>
            
            <!-- Hallway light overlays -->
            <div id="left-hallway" class="hallway"></div>
            <div id="right-hallway" class="hallway"></div>
        </div>

        <!-- THE MOBILE UI BUTTONS -->
        <div id="ui-layer">
            <button id="btn-exit">EXIT GAME</button>
            
            <!-- Left Side Buttons -->
            <div class="controls left-controls">
                <button id="btn-left-door" class="action-btn">DOOR</button>
                <button id="btn-left-light" class="action-btn">LIGHT</button>
            </div>

            <!-- Right Side Buttons -->
            <div class="controls right-controls">
                <button id="btn-right-door" class="action-btn">DOOR</button>
                <button id="btn-right-light" class="action-btn">LIGHT</button>
            </div>

            <!-- Camera Monitor Button -->
            <button id="btn-monitor">OPEN MONITOR</button>
        </div>

    </div>

    <script src="game.js"></script>
</body>
</html>
