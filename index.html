<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Five Nights at Freddy's: Browser Edition</title>
    <style>
        :root {
            --crt-glow: #33ff33;
            --alert-red: #ff3333;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050505;
            font-family: 'Courier New', Courier, monospace;
            color: #ffffff;
            overflow: hidden;
            user-select: none;
        }

        /* Scanline Overlay for CRT effect */
        .scanlines {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                rgba(18, 16, 16, 0) 50%, 
                rgba(0, 0, 0, 0.25) 50%
            ), linear-gradient(
                90deg,
                rgba(255, 0, 0, 0.06),
                rgba(0, 255, 0, 0.02),
                rgba(0, 0, 255, 0.06)
            );
            background-size: 100% 4px, 6px 100%;
            z-index: 99;
            pointer-events: none;
        }

        /* Game Container */
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 1024px;
            max-height: 768px;
            margin: 0 auto;
            background: #111;
            border: 4px solid #222;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Screen Elements */
        .screen {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            display: none;
        }

        .active {
            display: block;
        }

        /* Main Menu */
        #main-menu {
            background: #000;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 2.5rem;
            color: #ccc;
            margin-bottom: 50px;
            text-shadow: 0 0 8px rgba(255,255,255,0.3);
            letter-spacing: 4px;
        }

        .btn {
            background: transparent;
            border: 2px solid #555;
            color: #aaa;
            padding: 15px 40px;
            font-size: 1.2rem;
            cursor: pointer;
            font-family: inherit;
            transition: 0.3s;
        }

        .btn:hover {
            color: #fff;
            border-color: #fff;
            box-shadow: 0 0 10px rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
        }

        /* Office Screen */
        #office {
            background: #15151c;
        }

        /* HUD Info */
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .hud-item {
            font-size: 1.2rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px 2px #000;
        }

        #usage-display {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .usage-block {
            width: 12px;
            height: 18px;
            background-color: #33ff33;
        }

        #time-display {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 1.8rem;
            z-index: 10;
            text-shadow: 2px 2px 2px #000;
        }

        /* Office Environment View */
        #office-view {
            width: 100%;
            height: 80%;
            position: relative;
            background: linear-gradient(180deg, #101014 0%, #08080a 100%);
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding-bottom: 20px;
            box-sizing: border-box;
        }

        /* Doors and Controls */
        .door-control-panel {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: #222;
            padding: 10px;
            border: 2px solid #444;
            margin: 0 30px;
            z-index: 5;
        }

        .panel-btn {
            width: 60px;
            height: 40px;
            font-family: inherit;
            font-weight: bold;
            font-size: 0.8rem;
            cursor: pointer;
            border: 2px solid #111;
        }

        .door-btn { background: #555; color: white; }
        .door-btn.active-control { background: #900; color: #fff; border-color: red; }

        .light-btn { background: #555; color: white; }
        .light-btn.active-control { background: #ffcc00; color: #000; border-color: #fff; }

        /* Door visual representations */
        .door-frame {
            position: absolute;
            bottom: 0;
            width: 80px;
            height: 80%;
            background: #111;
            border: 4px solid #333;
            transition: transform 0.4s ease-in-out;
        }

        #left-door-frame { left: 100px; }
        #right-door-frame { right: 100px; }

        .door-visual {
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(0deg, #333, #333 10px, #222 10px, #222 20px);
            border-bottom: 10px solid #555;
            transform: translateY(-100%);
            transition: transform 0.3s ease-in-out;
        }

        .door-visual.closed {
            transform: translateY(0%);
        }

        /* Light cues for when animatronics are at the door */
        .light-overlay {
            position: absolute;
            top: 0;
            width: 250px;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.1s;
        }

        #left-light-overlay {
            left: 0;
            background: radial-gradient(circle at left, rgba(255,255,220,0.2) 0%, rgba(0,0,0,0) 70%);
        }

        #right-light-overlay {
            right: 0;
            background: radial-gradient(circle at right, rgba(255,255,220,0.2) 0%, rgba(0,0,0,0) 70%);
        }

        /* Window peeking */
        .window-pane {
            position: absolute;
            bottom: 25%;
            width: 60px;
            height: 100px;
            background: #08080a;
            border: 2px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #left-window { left: 190px; }
        #right-window { right: 190px; }

        .shadowy-eyes {
            width: 14px;
            height: 14px;
            background: #ff3333;
            border-radius: 50%;
            box-shadow: 0 0 10px #ff0000;
            display: none;
        }

        /* Monitor Hover Zone */
        #monitor-toggle-zone {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 45px;
            background: rgba(255,255,255,0.05);
            border-top: 2px dashed #444;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 10;
        }

        #monitor-toggle-zone:hover {
            background: rgba(255,255,255,0.15);
        }

        /* Monitor View Overlay */
        #monitor-view {
            background: #000;
            z-index: 20;
            display: none;
        }

        #camera-screen {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
        }

        #cam-feed-container {
            flex: 1;
            height: 100%;
            background: #000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #camera-canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #cam-overlay-info {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 1.5rem;
            color: var(--crt-glow);
            text-shadow: 0 0 5px #00ff00;
            z-index: 25;
        }

        #cam-static-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            pointer-events: none;
            z-index: 22;
        }

        /* Minimap & Controls */
        #map-container {
            width: 300px;
            height: 100%;
            background: #111;
            border-left: 2px solid #333;
            position: relative;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        #map-graphic {
            width: 100%;
            height: 60%;
            border: 2px solid #444;
            position: relative;
            background: #050505;
        }

        /* Map Rooms */
        .map-room {
            position: absolute;
            border: 1px solid #777;
            background: rgba(255,255,255,0.02);
            font-size: 0.65rem;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
        }

        #room-stage { top: 10%; left: 35%; width: 30%; height: 20%; }
        #room-dining { top: 40%; left: 25%; width: 50%; height: 25%; }
        #room-hall { top: 75%; left: 60%; width: 25%; height: 20%; }
        #room-corner { top: 75%; left: 20%; width: 25%; height: 20%; }

        .cam-btn {
            position: absolute;
            background: #222;
            color: #fff;
            border: 1px solid #777;
            padding: 3px 6px;
            font-size: 0.75rem;
            cursor: pointer;
            z-index: 30;
            font-family: inherit;
        }

        .cam-btn.active-cam {
            background: var(--crt-glow);
            color: #000;
            font-weight: bold;
            box-shadow: 0 0 8px var(--crt-glow);
        }

        /* Map Button Positions */
        #btn-cam-1a { top: 15%; left: 40%; }
        #btn-cam-1b { top: 45%; left: 45%; }
        #btn-cam-2a { top: 80%; left: 65%; }
        #btn-cam-2b { top: 80%; left: 25%; }

        /* Jumpscare Screen */
        #jumpscare-view {
            background: #000;
            z-index: 90;
            display: none;
            justify-content: center;
            align-items: center;
        }

        #jumpscare-canvas {
            width: 100%;
            height: 100%;
        }

        /* Shake animation for jumpscare */
        .shake {
            animation: shake-anim 0.05s infinite alternate;
        }

        @keyframes shake-anim {
            0% { transform: translate(5px, 5px) rotate(0deg); }
            100% { transform: translate(-5px, -5px) rotate(1deg); }
        }

        /* Game Over & Win Screen */
        .end-screen {
            background: #000;
            z-index: 100;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .blood-text {
            color: var(--alert-red);
            font-size: 3rem;
            text-shadow: 0 0 10px #ff0000;
            margin-bottom: 30px;
            letter-spacing: 5px;
        }

        .win-text {
            color: var(--crt-glow);
            font-size: 3rem;
            text-shadow: 0 0 10px #00ff00;
            margin-bottom: 30px;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div class="scanlines"></div>

    <div id="game-container">
        
        <!-- Main Menu -->
        <div id="main-menu" class="screen active">
            <h1>FIVE NIGHTS AT FREDDY'S<br><span style="font-size: 1rem; color: #555;">MINIMAL BROWSER PROTOTYPE</span></h1>
            <button class="btn" id="start-btn">NEW GAME</button>
        </div>

        <!-- Office View (Gameplay Loop) -->
        <div id="office" class="screen">
            <div id="hud">
                <div class="hud-item" id="power-display">Power: 100%</div>
                <div class="hud-item" id="usage-display">
                    Usage: 
                    <div class="usage-block" id="usage-1"></div>
                    <div class="usage-block" id="usage-2" style="visibility: hidden;"></div>
                    <div class="usage-block" id="usage-3" style="visibility: hidden;"></div>
                </div>
            </div>

            <div id="time-display">12 AM</div>

            <!-- Left and Right Lights and Doors -->
            <div id="office-view">
                <!-- Left Control Panel -->
                <div class="door-control-panel">
                    <button class="panel-btn door-btn" id="left-door-btn">DOOR</button>
                    <button class="panel-btn light-btn" id="left-light-btn">LIGHT</button>
                </div>

                <!-- Left Visuals -->
                <div class="door-frame" id="left-door-frame">
                    <div class="door-visual" id="left-door"></div>
                </div>
                <div class="window-pane" id="left-window">
                    <div class="shadowy-eyes" id="left-eyes"></div>
                </div>
                <div class="light-overlay" id="left-light-overlay"></div>

                <!-- Right Visuals -->
                <div class="light-overlay" id="right-light-overlay"></div>
                <div class="window-pane" id="right-window">
                    <div class="shadowy-eyes" id="right-eyes"></div>
                </div>
                <div class="door-frame" id="right-door-frame">
                    <div class="door-visual" id="right-door"></div>
                </div>

                <!-- Right Control Panel -->
                <div class="door-control-panel">
                    <button class="panel-btn door-btn" id="right-door-btn">DOOR</button>
                    <button class="panel-btn light-btn" id="right-light-btn">LIGHT</button>
                </div>
            </div>

            <!-- Monitor Hover Button -->
            <div id="monitor-toggle-zone">
                <span id="monitor-text">▲ OPEN CAMERA MONITOR ▲</span>
            </div>
        </div>

        <!-- Monitor View Overlay -->
        <div id="monitor-view" class="screen">
            <div id="camera-screen">
                <div id="cam-feed-container">
                    <div id="cam-overlay-info">CAM 1A - SHOW STAGE</div>
                    <canvas id="camera-canvas"></canvas>
                    <canvas id="cam-static-canvas"></canvas>
                </div>

                <!-- Map & Camera Navigation -->
                <div id="map-container">
                    <div style="font-size: 0.9rem; border-bottom: 1px solid #333; padding-bottom: 10px;">
                        SURVEILLANCE FEED
                    </div>
                    
                    <div id="map-graphic">
                        <div class="map-room" id="room-stage">STAGE</div>
                        <div class="map-room" id="room-dining">DINING AREA</div>
                        <div class="map-room" id="room-hall">EAST HALL</div>
                        <div class="map-room" id="room-corner">EAST CORNER</div>

                        <button class="cam-btn active-cam" id="btn-cam-1a" onclick="switchCam('1a')">1A</button>
                        <button class="cam-btn" id="btn-cam-1b" onclick="switchCam('1b')">1B</button>
                        <button class="cam-btn" id="btn-cam-2a" onclick="switchCam('2a')">2A</button>
                        <button class="cam-btn" id="btn-cam-2b" onclick="switchCam('2b')">2B</button>
                    </div>

                    <button class="btn" style="padding: 10px; font-size: 0.9rem;" id="close-monitor-btn">▼ CLOSE MONITOR</button>
                </div>
            </div>
        </div>

        <!-- Jumpscare View Overlay -->
        <div id="jumpscare-view" class="screen">
            <canvas id="jumpscare-canvas"></canvas>
        </div>

        <!-- End Screens -->
        <div id="game-over" class="screen end-screen">
            <div class="blood-text">GAME OVER</div>
            <button class="btn restart-btn">TRY AGAIN</button>
        </div>

        <div id="win-screen" class="screen end-screen">
            <div class="win-text">5:59 AM...</div>
            <div class="win-text" style="font-size: 4rem; animation: shake-anim 1s infinite alternate;" id="six-am-text">6:00 AM</div>
            <p style="color: #666; margin-bottom: 30px;">You survived Freddy Fazbear.</p>
            <button class="btn restart-btn">PLAY AGAIN</button>
        </div>

    </div>

    <script>
        // --- Web Audio API Synthesizer Configuration ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let backgroundHum = null;

        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'door') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } else if (type === 'light') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'camera-switch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.05);
            } else if (type === 'jumpscare') {
                // Harsh screeching white/brown noise emulation
                const bufferSize = audioCtx.sampleRate * 1.5;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = Math.random() * 2 - 1;
                }
                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                // Add bandpass filter to make it screechy
                const filter = audioCtx.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.setValueAtTime(1000, audioCtx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 1.5);

                noise.connect(filter);
                filter.connect(gainNode);
                gainNode.gain.setValueAtTime(0.8, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);

                noise.start();
                noise.stop(audioCtx.currentTime + 1.5);
            }
        }

        function startAmbience() {
            if (backgroundHum) return;
            backgroundHum = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            backgroundHum.type = 'triangle';
            backgroundHum.frequency.setValueAtTime(55, audioCtx.currentTime); // Low electric rumble
            gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
            backgroundHum.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            backgroundHum.start();
        }

        function stopAmbience() {
            if (backgroundHum) {
                backgroundHum.stop();
                backgroundHum = null;
            }
        }

        // --- Core Game Variables ---
        let gameActive = false;
        let power = 100;
        let usage = 1;
        let gameHour = 0; // 0 = 12 AM
        let timeInHourTicks = 0;

        // Animatronic (Freddy) State Engine
        // Path: 1A (Stage) -> 1B (Dining) -> 2A (Hallway) -> 2B (Corner) -> Door (Right Window)
        let freddyLocation = '1a'; 
        let currentCamera = '1a';
        let monitorOpen = false;

        let leftDoorOpen = true;
        let rightDoorOpen = true;
        let leftLightOn = false;
        let rightLightOn = false;

        // Rendering Canvases
        const camCanvas = document.getElementById('camera-canvas');
        const camCtx = camCanvas.getContext('2d');
        const staticCanvas = document.getElementById('cam-static-canvas');
        const staticCtx = staticCanvas.getContext('2d');
        const jumpCanvas = document.getElementById('jumpscare-canvas');
        const jumpCtx = jumpCanvas.getContext('2d');

        // Setup rendering resolutions
        camCanvas.width = 640;
        camCanvas.height = 480;
        staticCanvas.width = 150;
        staticCanvas.height = 150;
        jumpCanvas.width = 400;
        jumpCanvas.height = 400;

        // --- Core Engine Loops ---
        let gameTimer = null;
        let behaviorTimer = null;
        let renderLoop = null;

        function startGame() {
            gameActive = true;
            power = 100;
            usage = 1;
            gameHour = 0;
            timeInHourTicks = 0;
            freddyLocation = '1a';
            currentCamera = '1a';
            monitorOpen = false;
            leftDoorOpen = true;
            rightDoorOpen = true;
            leftLightOn = false;
            rightLightOn = false;

            updateDoorsAndLightsVisuals();
            startAmbience();

            // Toggle screens
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('office').classList.add('active');

            // Set running loops
            if (gameTimer) clearInterval(gameTimer);
            if (behaviorTimer) clearInterval(behaviorTimer);
            
            gameTimer = setInterval(tickGameEngine, 1000);
            behaviorTimer = setInterval(tickFreddyAI, 8000); // Decides movement every 8 seconds
            
            startRenderLoops();
        }

        function tickGameEngine() {
            if (!gameActive) return;

            // Power Consumption calculations
            calculateUsage();
            power -= (usage * 0.08); // Depletion speed based on active utilities
            if (power <= 0) {
                power = 0;
                blackout();
                return;
            }
            document.getElementById('power-display').innerText = `Power: ${Math.floor(power)}%`;

            // Keep track of time (1 hour every 45 seconds)
            timeInHourTicks++;
            if (timeInHourTicks >= 45) {
                timeInHourTicks = 0;
                gameHour++;
                if (gameHour > 6) gameHour = 6;
                
                let displayHour = gameHour === 0 ? 12 : gameHour;
                document.getElementById('time-display').innerText = `${displayHour} AM`;

                if (gameHour === 6) {
                    triggerWin();
                }
            }
        }

        function calculateUsage() {
            let activePowerUses = 1; // Baseline office usage
            if (!leftDoorOpen) activePowerUses++;
            if (!rightDoorOpen) activePowerUses++;
            if (leftLightOn) activePowerUses++;
            if (rightLightOn) activePowerUses++;
            if (monitorOpen) activePowerUses++;

            usage = activePowerUses;

            // Render usage blocks on screen UI
            for (let i = 1; i <= 3; i++) {
                const block = document.getElementById(`usage-${i}`);
                if (usage >= i + 1) {
                    block.style.visibility = 'visible';
                    if (usage === 2) block.style.backgroundColor = '#33ff33';
                    if (usage === 3) block.style.backgroundColor = '#ffcc00';
                    if (usage >= 4) block.style.backgroundColor = '#ff3333';
                } else {
                    block.style.visibility = 'hidden';
                }
            }
        }

        // --- Freddy AI Behavior logic ---
        function tickFreddyAI() {
            if (!gameActive) return;

            const aiChance = 0.5; // 50% movement chance
            if (Math.random() > aiChance) return; // Stays put

            // Movement Path Engine
            if (freddyLocation === '1a') {
                freddyLocation = '1b';
            } else if (freddyLocation === '1b') {
                freddyLocation = Math.random() > 0.5 ? '2a' : '2b';
            } else if (freddyLocation === '2a') {
                freddyLocation = '2b';
            } else if (freddyLocation === '2b') {
                // Moves to Office door trigger zone
                freddyLocation = 'door';
            } else if (freddyLocation === 'door') {
                // If right door is closed, Freddy gets blocked and retreats to Stage
                if (!rightDoorOpen) {
                    freddyLocation = '1a';
                    playSound('door'); // Spooky door slam echo
                } else {
                    // Freddy slips inside the office
                    freddyLocation = 'office_interior';
                }
            } else if (freddyLocation === 'office_interior') {
                // Slipped in undetected! Jumpscare is locked and inevitable next monitor flip
                if (!monitorOpen) {
                    triggerJumpscare();
                }
            }
        }

        // Check if eyes are seen in windows on light up
        function updateDoorsAndLightsVisuals() {
            // Update door graphics classes
            document.getElementById('left-door').className = `door-visual ${leftDoorOpen ? '' : 'closed'}`;
            document.getElementById('right-door').className = `door-visual ${rightDoorOpen ? '' : 'closed'}`;

            // Handle Light up renders
            document.getElementById('left-light-overlay').style.opacity = leftLightOn ? 1 : 0;
            document.getElementById('right-light-overlay').style.opacity = rightLightOn ? 1 : 0;

            // Handle eyes displaying when light hits the door
            // Freddy approaches from the right hallway (represented by right-eyes)
            if (rightLightOn && freddyLocation === 'door') {
                document.getElementById('right-eyes').style.display = 'block';
            } else {
                document.getElementById('right-eyes').style.display = 'none';
            }
        }

        // --- Custom Base64 Vector Graphic Creators (Clean rendering with canvas) ---
        function drawFreddy(ctx, x, y, scale) {
            ctx.save();
            ctx.translate(x, y);
            ctx.scale(scale, scale);

            // Shadow Head Shape
            ctx.fillStyle = '#1c0f0a';
            ctx.beginPath();
            ctx.arc(0, 0, 80, 0, Math.PI * 2);
            ctx.fill();

            // Left Ear
            ctx.beginPath();
            ctx.arc(-70, -70, 25, 0, Math.PI * 2);
            ctx.fill();
            // Right Ear
            ctx.beginPath();
            ctx.arc(70, -70, 25, 0, Math.PI * 2);
            ctx.fill();

            // Muzzle
            ctx.fillStyle = '#3a2312';
            ctx.beginPath();
            ctx.ellipse(0, 20, 50, 35, 0, 0, Math.PI * 2);
            ctx.fill();

            // Nose
            ctx.fillStyle = '#050505';
            ctx.beginPath();
            ctx.ellipse(0, 5, 20, 12, 0, 0, Math.PI * 2);
            ctx.fill();

            // Jaw
            ctx.fillStyle = '#150a06';
            ctx.beginPath();
            ctx.ellipse(0, 48, 45, 20, 0, 0, Math.PI * 2);
            ctx.fill();

            // Top Hat
            ctx.fillStyle = '#0a0a0d';
            ctx.fillRect(-45, -125, 90, 50); // Crown
            ctx.fillRect(-65, -80, 130, 10); // Brim

            // Spooky glowing eyes (Classic Freddy signature look)
            ctx.fillStyle = '#ff3333';
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.arc(-25, -15, 8, 0, Math.PI * 2);
            ctx.arc(25, -15, 8, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // --- Surveillance Screen Draw Engine ---
        function startRenderLoops() {
            function drawLoop() {
                if (!gameActive) return;

                // Render Active Camera Frame
                if (monitorOpen) {
                    renderActiveCamera();
                    renderStaticOverlay();
                }

                // If Freddy inside office when monitor is pulled down: immediate death
                if (!monitorOpen && freddyLocation === 'office_interior') {
                    triggerJumpscare();
                    return;
                }

                renderLoop = requestAnimationFrame(drawLoop);
            }
            renderLoop = requestAnimationFrame(drawLoop);
        }

        function renderActiveCamera() {
            // Draw background room geometry
            camCtx.fillStyle = '#08080a';
            camCtx.fillRect(0, 0, camCanvas.width, camCanvas.height);

            // Draw structural grids
            camCtx.strokeStyle = '#222';
            camCtx.lineWidth = 2;
            camCtx.beginPath();
            camCtx.moveTo(0, camCanvas.height * 0.7);
            camCtx.lineTo(camCanvas.width, camCanvas.height * 0.7); // Floor division
            camCtx.stroke();

            // Draw Freddy depending on where he is relative to selected Cam View
            if (currentCamera === '1a' && freddyLocation === '1a') {
                // Center stage position
                drawFreddy(camCtx, 320, 220, 1.2);
            } else if (currentCamera === '1b' && freddyLocation === '1b') {
                // Hallway/Dining deep frame perspective
                drawFreddy(camCtx, 300, 260, 0.75);
            } else if (currentCamera === '2a' && freddyLocation === '2a') {
                // Approaching corridor side profile
                drawFreddy(camCtx, 150, 240, 0.9);
            } else if (currentCamera === '2b' && freddyLocation === '2b') {
                // Extreme close up peek inside CAM 2B corner!
                drawFreddy(camCtx, 340, 210, 1.8);
            } else {
                // Draw spooky empty environment
                camCtx.fillStyle = '#ff3333';
                camCtx.font = "14px monospace";
                camCtx.fillText("[ NO SIGNAL DETECTED / FEED EMPTY ]", 170, 240);
            }
        }

        function renderStaticOverlay() {
            // Generates retro screen noise pattern on overlay canvas
            const imgData = staticCtx.createImageData(staticCanvas.width, staticCanvas.height);
            const data = imgData.data;
            for (let i = 0; i < data.length; i += 4) {
                const val = Math.floor(Math.random() * 255);
                data[i] = val;
                data[i + 1] = val;
                data[i + 2] = val;
                data[i + 3] = 45; // static intensity opacity
            }
            staticCtx.putImageData(imgData, 0, 0);
        }

        // --- Camera Switch Panel controller ---
        window.switchCam = function(camId) {
            currentCamera = camId;
            playSound('camera-switch');

            // Set UI updates
            const camLabels = {
                '1a': 'CAM 1A - SHOW STAGE',
                '1b': 'CAM 1B - DINING AREA',
                '2a': 'CAM 2A - EAST HALLWAY',
                '2b': 'CAM 2B - EAST HALL CORNER'
            };
            document.getElementById('cam-overlay-info').innerText = camLabels[camId];

            // Toggle active map UI elements
            document.querySelectorAll('.cam-btn').forEach(btn => btn.classList.remove('active-cam'));
            document.getElementById(`btn-cam-${camId}`).classList.add('active-cam');
        };

        // --- Interactive Click Events Setup ---
        document.getElementById('start-btn').addEventListener('click', () => {
            startGame();
        });

        document.querySelectorAll('.restart-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                startGame();
            });
        });

        // Left Door Utility Trigger
        document.getElementById('left-door-btn').addEventListener('click', (e) => {
            if (!gameActive) return;
            leftDoorOpen = !leftDoorOpen;
            playSound('door');
            e.target.classList.toggle('active-control', !leftDoorOpen);
            updateDoorsAndLightsVisuals();
        });

        // Right Door Utility Trigger
        document.getElementById('right-door-btn').addEventListener('click', (e) => {
            if (!gameActive) return;
            rightDoorOpen = !rightDoorOpen;
            playSound('door');
            e.target.classList.toggle('active-control', !rightDoorOpen);
            updateDoorsAndLightsVisuals();
        });

        // Left Light Toggle
        document.getElementById('left-light-btn').addEventListener('click', (e) => {
            if (!gameActive) return;
            leftLightOn = !leftLightOn;
            playSound('light');
            if (leftLightOn && rightLightOn) {
                rightLightOn = false;
                document.getElementById('right-light-btn').classList.remove('active-control');
            }
            e.target.classList.toggle('active-control', leftLightOn);
            updateDoorsAndLightsVisuals();
        });

        // Right Light Toggle
        document.getElementById('right-light-btn').addEventListener('click', (e) => {
            if (!gameActive) return;
            rightLightOn = !rightLightOn;
            playSound('light');
            if (rightLightOn && leftLightOn) {
                leftLightOn = false;
                document.getElementById('left-light-btn').classList.remove('active-control');
            }
            e.target.classList.toggle('active-control', rightLightOn);
            updateDoorsAndLightsVisuals();
        });

        // Monitor Hover trigger logic
        document.getElementById('monitor-toggle-zone').addEventListener('click', () => {
            if (!gameActive) return;
            toggleMonitor();
        });

        document.getElementById('close-monitor-btn').addEventListener('click', () => {
            if (!gameActive) return;
            toggleMonitor();
        });

        function toggleMonitor() {
            monitorOpen = !monitorOpen;
            playSound('camera-switch');
            
            const monitorEl = document.getElementById('monitor-view');
            if (monitorOpen) {
                monitorEl.style.display = 'block';
            } else {
                monitorEl.style.display = 'none';
            }
            calculateUsage();
        }

        // --- Blackout / Power Out Scenario ---
        function blackout() {
            gameActive = false;
            stopAmbience();
            clearInterval(gameTimer);
            clearInterval(behaviorTimer);
            cancelAnimationFrame(renderLoop);

            // Shutdown the UI lights/monitors instantly
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('office').classList.add('active');
            
            leftDoorOpen = true;
            rightDoorOpen = true;
            leftLightOn = false;
            rightLightOn = false;
            monitorOpen = false;
            updateDoorsAndLightsVisuals();

            // Set environment to pitch black
            document.getElementById('office').style.background = '#000000';
            document.getElementById('office-view').style.background = '#000000';
            document.getElementById('power-display').innerText = `Power: 0%`;

            // Spooky delayed jumpscare from dark room
            setTimeout(() => {
                if (!gameActive) {
                    triggerJumpscare();
                }
            }, Math.random() * 4000 + 3000);
        }

        // --- Game Over / Loss Engine State ---
        function triggerJumpscare() {
            gameActive = false;
            stopAmbience();
            clearInterval(gameTimer);
            clearInterval(behaviorTimer);
            cancelAnimationFrame(renderLoop);

            playSound('jumpscare');

            // Render shake effect
            const container = document.getElementById('game-container');
            container.classList.add('shake');

            // Present Jumpscare Layer Screen
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            const jumpScreen = document.getElementById('jumpscare-view');
            jumpScreen.style.display = 'flex';

            // Draw Scary Face to Jumpscare Canvas
            let jumpFrame = 0;
            function animateJumpscare() {
                jumpCtx.fillStyle = '#000000';
                jumpCtx.fillRect(0, 0, jumpCanvas.width, jumpCanvas.height);

                // Alternating frame sizes for intense movement animation
                const sizeMod = Math.sin(jumpFrame) * 0.15 + 1.2;
                drawFreddy(jumpCtx, 200, 200, sizeMod);

                jumpFrame++;
                if (jumpFrame < 45) {
                    requestAnimationFrame(animateJumpscare);
                } else {
                    // Final Clean up after jumpscare animation resolves
                    container.classList.remove('shake');
                    jumpScreen.style.display = 'none';
                    document.getElementById('game-over').classList.add('active');
                }
            }
            animateJumpscare();
        }

        // --- Win Logic State ---
        function triggerWin() {
            gameActive = false;
            stopAmbience();
            clearInterval(gameTimer);
            clearInterval(behaviorTimer);
            cancelAnimationFrame(renderLoop);

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById('win-screen').classList.add('active');
        }

    </script>
</body>
</html>
