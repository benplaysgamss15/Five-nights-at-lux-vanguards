<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Five Nights: 2D Web Edition</title>
    <style>
        /* Base Styling & Mobile Optimization */
        * { box-sizing: border-box; font-family: 'Courier New', Courier, monospace; user-select: none; }
        body { margin: 0; padding: 0; background-color: #000; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; color: white; }
        
        /* Game Container (16:9 Aspect Ratio) */
        #game-container { position: relative; width: 100vw; max-width: 1200px; aspect-ratio: 16/9; background-color: #111; overflow: hidden; border: 2px solid #333; }

        /* Office Room */
        .room { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; }
        .active { display: block; }
        
        #office { background: linear-gradient(to bottom, #2b2b2b 0%, #0a0a0a 100%); }
        .desk { position: absolute; bottom: -10%; left: 15%; width: 70%; height: 40%; background: linear-gradient(to bottom, #5c4033, #2d1e16); border-top: 8px solid #222; text-align: center; font-size: 2vw; padding-top: 2%; color: #999; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); z-index: 5; }
        .fan { position: absolute; top: 10%; left: 45%; width: 10%; height: 20%; background: radial-gradient(circle, #888, #333); border-radius: 50%; animation: spin 0.2s linear infinite; box-shadow: 0 0 10px #000; }
        @keyframes spin { 100% { transform: rotate(360deg); } }

        /* Doorways & Lights */
        .doorway { position: absolute; top: 5%; width: 18%; height: 65%; background: #050505; border: 5px solid #222; border-bottom: none; overflow: hidden; }
        .doorway.left { left: 5%; }
        .doorway.right { right: 5%; }
        
        .light-reveal { position: absolute; top: 0; left: 0; width: 100%; height: 100%; transition: background 0.2s; }
        .light-on { background: radial-gradient(circle at 50% 50%, #fff9c4, #4a4528); }

        /* Sliding Doors */
        .door { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: repeating-linear-gradient(45deg, #444, #444 10px, #333 10px, #333 20px); border-bottom: 20px solid #d35400; transform: translateY(-100%); transition: transform 0.3s ease-in; z-index: 10; box-shadow: inset 0 -10px 20px #000; }
        .door.closed { transform: translateY(0); }

        /* Animatronics at the Door */
        .door-module { position: absolute; bottom: 0; left: 10%; width: 80%; height: 80%; opacity: 0; display: flex; align-items: flex-end; justify-content: center; transition: opacity 0.2s; pointer-events: none; }
        .light-on .door-module { opacity: 1; }

        /* Buttons */
        .control-panel { position: absolute; top: 25%; width: 6%; height: 35%; display: flex; flex-direction: column; justify-content: space-around; align-items: center; background: #222; border: 2px solid #111; padding: 5px 0; border-radius: 5px; }
        .control-panel.left { left: 24%; }
        .control-panel.right { right: 24%; }
        .btn { width: 80%; aspect-ratio: 1; border-radius: 50%; border: 3px solid #555; cursor: pointer; font-weight: bold; font-size: 0.8vw; display: flex; justify-content: center; align-items: center; background: #111; color: white; transition: 0.2s; }
        .btn.door-btn:active { transform: scale(0.9); }
        .btn.light-btn:active { transform: scale(0.9); }
        .btn.active-door { background: #e74c3c; border-color: #ff9999; box-shadow: 0 0 15px #e74c3c; }
        .btn.active-light { background: #f1c40f; border-color: #ffffcc; box-shadow: 0 0 15px #f1c40f; color: black; }

        /* CAMERA SYSTEM - Panning Logic */
        #camera-system { background: #000; z-index: 20; }
        .crt-overlay { position: absolute; top:0; left:0; width:100%; height:100%; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06)); background-size: 100% 2px, 3px 100%; z-index: 25; pointer-events: none; opacity: 0.6; }
        
        #cam-viewport { position: absolute; top: 5%; left: 5%; width: 60%; height: 75%; border: 4px solid #fff; overflow: hidden; background: #111; box-shadow: 0 0 20px rgba(255,255,255,0.2); }
        
        /* The world inside the camera that actually moves */
        #cam-world { position: absolute; top: 0; left: 0; width: 150%; height: 100%; animation: panAnim 10s ease-in-out infinite alternate; background-size: cover; }
        
        @keyframes panAnim { 0% { transform: translateX(0%); } 100% { transform: translateX(-33.33%); } }

        /* Specific Camera Room Backgrounds */
        .bg-1A { background: linear-gradient(to bottom, #1a0a00 30%, #5c4033 30%), repeating-linear-gradient(90deg, #3e2723, #3e2723 50px, #2a1610 50px, #2a1610 100px); } /* Stage */
        .bg-1B { background: repeating-conic-gradient(#111 0% 25%, #dddddd 0% 50%) 50% / 80px 80px; } /* Dining Checkers */
        .bg-1C { background: repeating-linear-gradient(to right, #4a148c, #4a148c 30px, #2d004d 30px, #2d004d 60px); } /* Pirate Cove Curtains */
        .bg-2A { background: radial-gradient(ellipse at center, #333 0%, #000 70%); } /* West Hall */
        .bg-2B { background: radial-gradient(ellipse at center, #333 0%, #000 70%); } /* East Hall */
        .bg-3  { background: linear-gradient(to bottom, #222, #000); } /* Closet */

        /* Animatronic Modules in Cameras */
        .cam-sprite { position: absolute; bottom: 10%; transition: all 0.5s ease; filter: drop-shadow(5px 5px 10px #000); }

        #cam-name { position: absolute; top: 5%; left: 5%; font-size: 1.5vw; background: rgba(0,0,0,0.8); padding: 5px 15px; z-index: 26; border: 1px solid white; }
        
        .map { position: absolute; bottom: 5%; right: 2%; width: 30%; height: 60%; background: rgba(0,0,0,0.7); border: 2px solid white; padding: 2%; z-index: 26; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: repeat(3, 1fr); gap: 5px; }
        .cam-btn { background: #333; border: 1px solid white; color: white; cursor: pointer; font-size: 1.2vw; transition: 0.2s; }
        .cam-btn.active { background: #2ecc71; color: black; box-shadow: 0 0 10px #2ecc71; }
        
        /* UI Bottom Buttons */
        .bottom-bar { position: absolute; bottom: 3%; left: 35%; width: 30%; height: 10%; display: flex; justify-content: center; z-index: 30; }
        .toggle-cam-btn { width: 100%; background: rgba(255, 255, 255, 0.1); border: 2px solid white; color: white; font-size: 1.5vw; cursor: pointer; border-radius: 5px; transition: 0.2s; text-transform: uppercase; }
        .toggle-cam-btn:hover { background: rgba(255, 255, 255, 0.4); }
        .exit-cam-btn { background: rgba(231, 76, 60, 0.3); border-color: #e74c3c; color: #ffcccc; }
        .exit-cam-btn:hover { background: rgba(231, 76, 60, 0.6); }

        /* Stats */
        #stats { position: absolute; top: 2%; right: 2%; text-align: right; z-index: 30; font-size: 1.8vw; text-shadow: 2px 2px 0 #000; }
        .usage-bar { color: #2ecc71; font-weight: bold; letter-spacing: 2px; }

        /* Overlays */
        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: black; z-index: 100; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        #jumpscare-module { width: 100%; height: 100%; animation: jumpZoom 0.3s forwards, shake 0.1s infinite; display: flex; justify-content: center; align-items: center; background: #000; }
        #jumpscare-module svg { height: 120%; }

        @keyframes shake { 0% { transform: translate(10px, 5px); } 25% { transform: translate(-15px, -10px); } 50% { transform: translate(5px, 15px); } 75% { transform: translate(-10px, -5px); } 100% { transform: translate(10px, 5px); } }
        @keyframes jumpZoom { 0% { transform: scale(0.5); } 100% { transform: scale(1.5); } }
        
        #lux-overlay { position: absolute; top:0; left:0; width:100%; height:100%; z-index: 15; display: none; justify-content: center; align-items: center; opacity: 0.8; animation: flash 0.1s infinite; }
        @keyframes flash { 0% { opacity: 0.8; } 50% { opacity: 0.3; } 100% { opacity: 0.8; } }
    </style>
</head>
<body>

<div id="game-container">
    <!-- UI Stats -->
    <div id="stats">
        <div id="time-display">12:00 AM</div>
        <div>Power: <span id="power-display">100%</span></div>
        <div>Usage: <span id="usage-display" class="usage-bar">|</span></div>
    </div>

    <!-- Office -->
    <div id="office" class="room active">
        <!-- Left Doorway -->
        <div class="doorway left">
            <div id="left-light" class="light-reveal"></div>
            <div id="left-module" class="door-module"></div>
            <div id="door-left" class="door"></div>
        </div>
        <div class="control-panel left">
            <div class="btn door-btn" id="btn-door-left" onclick="toggleDoor('left')">DOOR</div>
            <div class="btn light-btn" id="btn-light-left" onclick="toggleLight('left')">LIGHT</div>
        </div>

        <!-- Right Doorway -->
        <div class="doorway right">
            <div id="right-light" class="light-reveal"></div>
            <div id="right-module" class="door-module"></div>
            <div id="door-right" class="door"></div>
        </div>
        <div class="control-panel right">
            <div class="btn door-btn" id="btn-door-right" onclick="toggleDoor('right')">DOOR</div>
            <div class="btn light-btn" id="btn-light-right" onclick="toggleLight('right')">LIGHT</div>
        </div>

        <div class="fan"></div>
        <div class="desk">SECURITY DESK</div>
        
        <!-- Lux Illusion -->
        <div id="lux-overlay"></div>

        <div class="bottom-bar">
            <button class="toggle-cam-btn" onclick="toggleCameras()">OPEN CAMERAS</button>
        </div>
    </div>

    <!-- Moving Camera System -->
    <div id="camera-system" class="room">
        <div class="crt-overlay"></div>
        
        <div id="cam-viewport">
            <div id="cam-name">CAM 1A - Show Stage</div>
            <!-- This world pans left and right -->
            <div id="cam-world" class="bg-1A">
                <div id="cam-sprites" style="position: relative; width: 100%; height: 100%;"></div>
            </div>
        </div>
        
        <div class="map">
            <button class="cam-btn active" id="cam-1a" onclick="switchCam('1A', 'Show Stage')">CAM 1A</button>
            <button class="cam-btn" id="cam-1b" onclick="switchCam('1B', 'Dining Area')">CAM 1B</button>
            <button class="cam-btn" id="cam-1c" onclick="switchCam('1C', 'Pirate Cove')">CAM 1C</button>
            <button class="cam-btn" id="cam-2a" onclick="switchCam('2A', 'West Hall')">CAM 2A</button>
            <button class="cam-btn" id="cam-2b" onclick="switchCam('2B', 'East Hall')">CAM 2B</button>
            <button class="cam-btn" id="cam-3" onclick="switchCam('3', 'Supply Closet')">CAM 3</button>
        </div>

        <div class="bottom-bar">
            <button class="toggle-cam-btn exit-cam-btn" onclick="toggleCameras()">▼ EXIT CAMERAS ▼</button>
        </div>
    </div>

    <!-- Screens -->
    <div id="jumpscare" class="overlay">
        <div id="jumpscare-module"></div>
    </div>

    <div id="win-screen" class="overlay">
        <div style="font-size: 8vw; color: #2ecc71;">6:00 AM</div>
        <div style="font-size: 4vw;">You Survived!</div>
        <div style="margin-top: 20px; font-size: 2vw; cursor: pointer;" onclick="location.reload()">[ REFRESH TO PLAY AGAIN ]</div>
    </div>
</div>

<script>
    // --- ANIMATRONIC MODULES (Vector Sprites built in pure SVG) ---
    const svgs = {
        notnoob: `<svg viewBox="0 0 100 100" style="width:100%; height:100%;">
            <!-- Freddy / Notnoob -->
            <rect x="35" y="5" width="30" height="20" fill="#111"/> <!-- Hat -->
            <rect x="25" y="25" width="50" height="5" fill="#111"/>
            <circle cx="20" cy="30" r="15" fill="#5C4033"/> <!-- Ears -->
            <circle cx="80" cy="30" r="15" fill="#5C4033"/>
            <circle cx="50" cy="60" r="40" fill="#5C4033"/> <!-- Head -->
            <ellipse cx="50" cy="75" rx="25" ry="15" fill="#8B5A2B"/> <!-- Snout -->
            <circle cx="35" cy="50" r="8" fill="#fff"/><circle cx="35" cy="50" r="3" fill="#000"/> <!-- Eyes -->
            <circle cx="65" cy="50" r="8" fill="#fff"/><circle cx="65" cy="50" r="3" fill="#000"/>
            <ellipse cx="50" cy="65" rx="8" ry="5" fill="#000"/> <!-- Nose -->
        </svg>`,
        
        ben: `<svg viewBox="0 0 100 100" style="width:100%; height:100%;">
            <!-- Bonnie / Ben -->
            <ellipse cx="30" cy="30" rx="10" ry="30" fill="#4B0082"/> <!-- Long Ears -->
            <ellipse cx="70" cy="30" rx="10" ry="30" fill="#4B0082"/>
            <ellipse cx="50" cy="65" rx="35" ry="30" fill="#4B0082"/> <!-- Head -->
            <ellipse cx="50" cy="75" rx="20" ry="15" fill="#D8BFD8"/> <!-- Snout -->
            <circle cx="35" cy="55" r="7" fill="#fff"/><circle cx="35" cy="55" r="3" fill="#ff0000"/> <!-- Eyes -->
            <circle cx="65" cy="55" r="7" fill="#fff"/><circle cx="65" cy="55" r="3" fill="#ff0000"/>
            <ellipse cx="50" cy="68" rx="6" ry="4" fill="#000"/>
        </svg>`,

        panda: `<svg viewBox="0 0 100 100" style="width:100%; height:100%;">
            <!-- Chica (Panda version) -->
            <circle cx="20" cy="30" r="15" fill="#111"/> <!-- Black Ears -->
            <circle cx="80" cy="30" r="15" fill="#111"/>
            <circle cx="50" cy="60" r="38" fill="#fff"/> <!-- White Face -->
            <ellipse cx="35" cy="55" rx="12" ry="15" fill="#111"/> <!-- Black Eye Patches -->
            <ellipse cx="65" cy="55" rx="12" ry="15" fill="#111"/>
            <circle cx="35" cy="55" r="4" fill="#fff"/> <!-- Eyes -->
            <circle cx="65" cy="55" r="4" fill="#fff"/>
            <ellipse cx="50" cy="75" rx="10" ry="6" fill="#111"/> <!-- Nose -->
        </svg>`,

        random_guy: `<svg viewBox="0 0 100 100" style="width:100%; height:100%;">
            <!-- Foxy / Random Guy -->
            <polygon points="10,20 30,50 10,70" fill="#B22222"/> <!-- Ear Fluffs -->
            <polygon points="90,20 70,50 90,70" fill="#B22222"/>
            <polygon points="50,90 15,40 85,40" fill="#B22222"/> <!-- Head Shape -->
            <circle cx="35" cy="50" r="8" fill="#ffcc00"/><circle cx="35" cy="50" r="3" fill="#000"/> <!-- Yellow Eye -->
            <rect x="55" y="45" width="20" height="10" fill="#111"/> <!-- Eyepatch -->
            <line x1="85" y1="30" x2="65" y2="50" stroke="#111" stroke-width="3"/>
            <circle cx="50" cy="80" r="5" fill="#000"/> <!-- Nose -->
        </svg>`,

        lux: `<svg viewBox="0 0 100 100" style="width:100%; height:100%;">
            <!-- Golden Freddy / Lux -->
            <rect x="35" y="5" width="30" height="20" fill="#222"/> 
            <rect x="25" y="25" width="50" height="5" fill="#222"/>
            <circle cx="20" cy="30" r="15" fill="#FFD700"/> 
            <circle cx="80" cy="30" r="15" fill="#FFD700"/>
            <circle cx="50" cy="60" r="40" fill="#FFD700"/> 
            <ellipse cx="50" cy="75" rx="25" ry="15" fill="#DAA520"/> 
            <circle cx="35" cy="50" r="8" fill="#000"/><circle cx="35" cy="50" r="2" fill="#fff"/> <!-- Empty staring eyes -->
            <circle cx="65" cy="50" r="8" fill="#000"/><circle cx="65" cy="50" r="2" fill="#fff"/>
            <ellipse cx="50" cy="65" rx="8" ry="5" fill="#000"/>
        </svg>`
    };

    // --- GAME STATE ---
    let time = 0; 
    let power = 100.0;
    let inCameras = false;
    let currentCam = '1A';
    let isGameOver = false;

    let state = { doorLeft: false, doorRight: false, lightLeft: false, lightRight: false };

    // AI Logic Base
    let animatronics = {
        notnoob: { key: "notnoob", pos: "1A", level: 3, path:["1A", "1B", "2B", "RightDoor"], render: { left: '40%', height: '55%' } },
        panda:   { key: "panda", pos: "1A", level: 5, path:["1A", "1B", "2B", "RightDoor"], render: { left: '65%', height: '50%' } },
        ben:     { key: "ben", pos: "1A", level: 6, path:["1A", "1B", "2A", "3", "LeftDoor"], render: { left: '15%', height: '60%' } },
        foxy:    { key: "random_guy", pos: "1C", level: 4, stages: 0, render: { left: '40%', height: '45%' } }, // stages: 0=hidden, 1=peeking, 2=out, 3=attacking
        lux:     { key: "lux", active: false, timer: 0 }
    };

    let intervals = {};

    function startGame() {
        intervals.clock = setInterval(updateTime, 60000); // 1 hour = 60s
        intervals.power = setInterval(updatePower, 1000); 
        intervals.ai = setInterval(updateAI, 4000); // Move every 4s
        renderCams();
    }

    // --- DOORS & LIGHTS ---
    function toggleDoor(side) {
        if(isGameOver || power <= 0) return;
        state[side === 'left' ? 'doorLeft' : 'doorRight'] = !state[side === 'left' ? 'doorLeft' : 'doorRight'];
        
        document.getElementById(`door-${side}`).classList.toggle('closed', state[side === 'left' ? 'doorLeft' : 'doorRight']);
        document.getElementById(`btn-door-${side}`).classList.toggle('active-door', state[side === 'left' ? 'doorLeft' : 'doorRight']);
        
        updateUsage();
        if(side === 'left' && animatronics.foxy.stages === 3 && state.doorLeft) {
            power = Math.max(0, power - 5); // Foxy drain
            animatronics.foxy.stages = 0;
        }
    }

    function toggleLight(side) {
        if(isGameOver || power <= 0) return;
        if(side === 'left' && state.lightRight) toggleLight('right'); // only 1 light max
        if(side === 'right' && state.lightLeft) toggleLight('left');

        state[side === 'left' ? 'lightLeft' : 'lightRight'] = !state[side === 'left' ? 'lightLeft' : 'lightRight'];
        
        document.getElementById(`${side}-light`).classList.toggle('light-on', state[side === 'left' ? 'lightLeft' : 'lightRight']);
        document.getElementById(`btn-light-${side}`).classList.toggle('active-light', state[side === 'left' ? 'lightLeft' : 'lightRight']);
        
        updateUsage();
        renderDoorways();
    }

    // --- CAMERAS (The visual panners) ---
    function toggleCameras() {
        if(isGameOver || power <= 0) return;
        inCameras = !inCameras;
        
        document.getElementById('office').classList.toggle('active', !inCameras);
        document.getElementById('camera-system').classList.toggle('active', inCameras);
        
        if(!inCameras && animatronics.lux.active) {
            animatronics.lux.active = false; // Putting cams down dismisses Lux
            document.getElementById('lux-overlay').style.display = 'none';
        }
        updateUsage();
        if(inCameras) renderCams();
    }

    function switchCam(id, name) {
        if(isGameOver) return;
        currentCam = id;
        document.getElementById('cam-name').innerText = `CAM ${id} - ${name}`;
        
        document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`cam-${id.toLowerCase()}`).classList.add('active');
        
        // Change physical background of the panning world
        const world = document.getElementById('cam-world');
        world.className = `bg-${id}`;
        
        renderCams();
    }

    function renderCams() {
        const spriteContainer = document.getElementById('cam-sprites');
        spriteContainer.innerHTML = ""; // clear old sprites

        // Normal Animatronics
        ['notnoob', 'panda', 'ben'].forEach(key => {
            let bot = animatronics[key];
            if(bot.pos === currentCam) {
                let div = document.createElement('div');
                div.className = 'cam-sprite';
                div.style.left = bot.render.left;
                div.style.height = bot.render.height;
                div.style.width = '25%'; // Keep aspect ratio relatively square
                div.innerHTML = svgs[key];
                spriteContainer.appendChild(div);
            }
        });

        // Foxy (Random Guy) Logic on Cam 1C
        if(currentCam === '1C' && animatronics.foxy.stages > 0 && animatronics.foxy.stages < 3) {
            let div = document.createElement('div');
            div.className = 'cam-sprite';
            div.style.left = animatronics.foxy.render.left;
            div.style.height = animatronics.foxy.render.height;
            div.style.width = '20%';
            // If peeking, make him lower and smaller
            if(animatronics.foxy.stages === 1) {
                div.style.bottom = '-5%'; 
                div.style.transform = 'scale(0.8)';
            }
            div.innerHTML = svgs[animatronics.foxy.key];
            spriteContainer.appendChild(div);
        }
    }

    function renderDoorways() {
        const leftMod = document.getElementById('left-module');
        if(animatronics.ben.pos === "LeftDoor" && state.lightLeft) {
            leftMod.innerHTML = svgs.ben;
        } else { leftMod.innerHTML = ""; }

        const rightMod = document.getElementById('right-module');
        if(animatronics.panda.pos === "RightDoor" && state.lightRight) {
            rightMod.innerHTML = svgs.panda;
        } else if (animatronics.notnoob.pos === "RightDoor" && state.lightRight) {
            rightMod.innerHTML = svgs.notnoob;
        } else { rightMod.innerHTML = ""; }
    }

    // --- AI MOVEMENT ---
    function updateAI() {
        if(isGameOver) return;

        ['ben', 'panda', 'notnoob'].forEach(botKey => {
            let bot = animatronics[botKey];
            if(Math.random() * 20 < bot.level) {
                let idx = bot.path.indexOf(bot.pos);
                if(bot.pos === "LeftDoor" || bot.pos === "RightDoor") {
                    let isLeft = bot.pos === "LeftDoor";
                    let doorClosed = isLeft ? state.doorLeft : state.doorRight;
                    if(doorClosed) bot.pos = bot.path[1]; // Reset to 1B
                    else if(!inCameras) triggerJumpscare(bot.key);
                } else if (idx < bot.path.length - 1) {
                    bot.pos = bot.path[idx + 1];
                }
            }
        });

        // Foxy Logic
        if(Math.random() * 20 < animatronics.foxy.level) {
            if(animatronics.foxy.stages < 3) {
                if(!(inCameras && currentCam === '1C')) animatronics.foxy.stages++;
            } else if(animatronics.foxy.stages === 3) {
                if(state.doorLeft) { power = Math.max(0, power - 5); animatronics.foxy.stages = 0; }
                else triggerJumpscare(animatronics.foxy.key);
            }
        }

        // Lux (Golden Freddy) Logic
        if(!animatronics.lux.active && !inCameras && Math.random() < 0.02) { 
            animatronics.lux.active = true;
            document.getElementById('lux-overlay').innerHTML = svgs.lux;
            document.getElementById('lux-overlay').style.display = 'flex';
            animatronics.lux.timer = 0;
        }
        if(animatronics.lux.active && !inCameras) {
            animatronics.lux.timer++;
            if(animatronics.lux.timer > 2) triggerJumpscare(animatronics.lux.key);
        }

        if(inCameras) renderCams();
        renderDoorways();
    }

    // --- SYSTEMS ---
    function updatePower() {
        if(isGameOver) return;
        let usage = 1 + (state.doorLeft?1:0) + (state.doorRight?1:0) + (state.lightLeft?1:0) + (state.lightRight?1:0) + (inCameras?1:0);
        power -= (0.1 * usage);
        if(power <= 0) { power = 0; powerOutage(); }
        document.getElementById('power-display').innerText = Math.floor(power) + "%";
    }

    function updateUsage() {
        let usage = 1 + (state.doorLeft?1:0) + (state.doorRight?1:0) + (state.lightLeft?1:0) + (state.lightRight?1:0) + (inCameras?1:0);
        document.getElementById('usage-display').innerText = "||||||".substring(0, usage);
        document.getElementById('usage-display').style.color = usage <= 2 ? "#2ecc71" : usage <= 4 ? "#f1c40f" : "#e74c3c";
    }

    function updateTime() {
        if(isGameOver) return;
        time++;
        document.getElementById('time-display').innerText = time === 0 ? "12:00 AM" : time + ":00 AM";
        if(time === 6) winGame();
    }

    function powerOutage() {
        if(inCameras) toggleCameras();
        if(state.doorLeft) toggleDoor('left');
        if(state.doorRight) toggleDoor('right');
        if(state.lightLeft) toggleLight('left');
        if(state.lightRight) toggleLight('right');
        
        document.getElementById('office').style.background = "#000";
        document.querySelectorAll('.control-panel, .bottom-bar, .fan').forEach(e => e.style.display = 'none');
        
        setTimeout(() => triggerJumpscare('notnoob'), 5000); 
    }

    // --- ENDINGS ---
    function triggerJumpscare(key) {
        if(isGameOver) return;
        isGameOver = true;
        clearInterval(intervals.clock); clearInterval(intervals.power); clearInterval(intervals.ai);
        
        document.getElementById('jumpscare').style.display = 'flex';
        document.getElementById('jumpscare-module').innerHTML = svgs[key];
    }

    function winGame() {
        if(isGameOver) return;
        isGameOver = true;
        clearInterval(intervals.clock); clearInterval(intervals.power); clearInterval(intervals.ai);
        document.getElementById('win-screen').style.display = 'flex';
    }

    window.onload = startGame;
</script>
</body>
</html>
